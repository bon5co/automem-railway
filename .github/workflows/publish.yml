name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - context: .
            image: automem-railway
            tag: 0.16.1
          - context: falkordb
            image: automem-railway-falkordb
            tag: v4.20.4
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/bon5co/${{ matrix.image }}:${{ matrix.tag }}
            ghcr.io/bon5co/${{ matrix.image }}:latest
